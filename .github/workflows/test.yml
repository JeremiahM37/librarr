name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true, check-latest: true}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run 'gofmt -w .' locally:"
            echo "$unformatted"
            exit 1
          fi
      - name: go build
        run: go build -o librarr ./cmd/librarr/
      - name: go test (race)
        run: go test ./... -v -count=1 -race
      - name: go test fuzz (short)
        run: |
          # -fuzz must match exactly one target, so fuzz each discovered target
          # in turn rather than passing a regex that matches several.
          for pkg in ./internal/search/ ./internal/api/; do
            for target in $(go test "$pkg" -list '^Fuzz' | grep '^Fuzz'); do
              echo "==> fuzzing $pkg $target"
              go test "$pkg" -run='^$' -fuzz="^${target}$" -fuzztime=15s -count=1
            done
          done
      - name: go test integration
        run: go test -tags=integration ./internal/integration/... -v -count=1 -race
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: smoke test — binary boots and responds
        run: |
          mkdir -p /tmp/smoke-data
          LIBRARR_PORT=15050 \
          LIBRARR_DB_PATH=/tmp/smoke-data/librarr.db \
          SETTINGS_FILE=/tmp/smoke-data/settings.json \
            ./librarr > /tmp/smoke.log 2>&1 &
          SMOKE_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:15050/api/auth/status; then
              echo "binary up after ${i}*500ms"
              break
            fi
            sleep 0.5
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:15050/api/auth/status; then
            echo "::error::binary failed to respond within 15s"
            cat /tmp/smoke.log
            kill $SMOKE_PID 2>/dev/null
            exit 1
          fi
          curl -sf http://127.0.0.1:15050/api/health > /dev/null \
            || { echo "::error::/api/health failed"; cat /tmp/smoke.log; kill $SMOKE_PID 2>/dev/null; exit 1; }
          kill $SMOKE_PID 2>/dev/null
          if grep -qiE "panic|fatal" /tmp/smoke.log; then
            echo "::error::panic/fatal in boot log:"
            cat /tmp/smoke.log
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t librarr:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true, check-latest: true}
      - name: build binary
        run: go build -o /tmp/librarr ./cmd/librarr/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: install e2e deps
        run: |
          pip install -r e2e/requirements.txt
          playwright install --with-deps chromium
      - name: e2e user journey (hermetic — stubbed sources, real browser)
        env:
          LIBRARR_E2E_BIN: /tmp/librarr
        run: pytest e2e/ -v
      - name: server log on failure
        if: failure()
        run: cat /tmp/pytest-of-*/pytest-*/data*/librarr.log 2>/dev/null || true
