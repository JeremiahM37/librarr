name: Continuous Deployment
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Publish ghcr.io/<owner>/librarr:canary for every push to main that passes CI
  canary:
    name: Canary Release
    needs: ci
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        run: |
          echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.name }}/librarr:canary
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: VERSION_SUFFIX=-canary+${{ steps.meta.outputs.sha }}
