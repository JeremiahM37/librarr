name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: false}
      - run: go test ./... -count=1
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: "release --clean"}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  docker:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          image="ghcr.io/${{ steps.owner.outputs.name }}/librarr:${tag}"
          if echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            image="${image},ghcr.io/${{ steps.owner.outputs.name }}/librarr:latest"
          fi
          echo "images=${image}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.images }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            CHANNEL=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
